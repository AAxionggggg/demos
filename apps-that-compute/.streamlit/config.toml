# "Cairn" theme: dual light/dark with compact dashboard spacing, adapted from
# the skill's bi-dashboard template. Categorical palettes were checked with a
# CVD validator in both modes (adjacent pairs; the first three slots also pass
# all-pairs for scatter charts).

[theme]
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "20px", "16px", "15px", "14px", "12px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 700
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

[theme.light]
primaryColor = "#007A6D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6F5"
codeBackgroundColor = "#F2F6F5"
textColor = "#0F1A19"
linkColor = "#007A6D"
borderColor = "#E1E8E6"
