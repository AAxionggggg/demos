blueColor = "#0B84E5"
greenColor = "#16A34A"
yellowColor = "#CA8A04"
orangeColor = "#EA580C"
redColor = "#DC2626"
violetColor = "#7C5BD6"
grayColor = "#6B7472"
chartCategoricalColors = [
    "#008A7B",
    "#E8590C",
    "#5B5BD6",
    "#D6409F",
    "#0B84E5",
    "#B87A00",
    "#8E4EC6",
    "#E5484D",
]
