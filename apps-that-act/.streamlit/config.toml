# "Cairn Ops" theme: a crisp operations console with cool slate neutrals, IBM
# Plex type, tight corners, and an electric-blue accent, in light and dark.
# Categorical palettes were checked with a CVD validator in both modes
# (adjacent pairs; the first three slots also pass all-pairs for scatter charts).

[theme]
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["26px", "20px", "16px", "15px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 600
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F9"
codeBackgroundColor = "#F3F5F9"
textColor = "#0B1220"
linkColor = "#1D4ED8"
borderColor = "#E2E7EF"
codeTextColor = "#334155"
blueColor = "#2563EB"
greenColor = "#15803D"
yellowColor = "#CA8A04"
orangeColor = "#D97706"
redColor = "#DC2626"
violetColor = "#7C3AED"
grayColor = "#64748B"
chartCategoricalColors = [
    "#2563EB",
    "#D97706",
    "#0D9488",
    "#9333EA",
    "#DC2626",
    "#0284C7",
    "#DB2777",
    "#65A30D",
]
