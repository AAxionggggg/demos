    "#93B4FD",
    "#6090FA",
    "#3B71F3",
    "#2563EB",
    "#1D4ED8",
    "#1E40AF",
    "#1E3A8A",
]
dataframeBorderColor = "#E2E7EF"
dataframeHeaderBackgroundColor = "#F7F9FC"
dataframeHeaderTextColor = "#475569"

