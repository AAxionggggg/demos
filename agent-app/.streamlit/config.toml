# "Ivory" theme: a calm, literary look for a chat app. Warm ivory surfaces, a
# clay accent, a serif for headings and a soft sans for text, in light and dark.
# The clay passes 4.5:1 against white button text and against the light
# background. Categorical palettes were checked with a CVD simulation in both
# modes (adjacent pairs; the first three slots also pass all-pairs).

[theme]
font = "'DM Sans':https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["36px", "24px", "19px", "16px", "15px", "13px"]
headingFontWeights = [500, 500, 600, 600, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 500
baseRadius = "0.9rem"
buttonRadius = "0.65rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

